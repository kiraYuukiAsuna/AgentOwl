# Install on the host after replacing the domain and certificate paths.
# This file is not part of Docker Compose.
server {
    listen 80;
    server_name agentowl.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name agentowl.example.com;
    ssl_certificate /etc/letsencrypt/live/agentowl.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agentowl.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ ^/(api/v1(?:/|$)|auth(?:/|$)|hooks(?:/|$)) {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Runner authorization and internal routes must never be reachable publicly.
    location /internal/ { return 404; }
}
